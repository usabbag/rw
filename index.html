<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Card 1: Header + Search -->
        <div class="card">
            <header>
                <h1>Relative Weather</h1>
                <p>How does today feel compared to yesterday?</p>
            </header>

            <div class="search-section">
                <div class="search-input-wrapper">
                    <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
                    <button id="searchBtn">Get Weather</button>
                    <div id="citySuggestions" class="city-suggestions hidden"></div>
                </div>
            </div>
        </div>

        <!-- City Label -->
        <div id="cityLabel" class="city-label hidden"></div>

        <!-- Card 2: Current Conditions (Compact) -->
        <div id="currentConditionsCard" class="current-conditions-card card hidden">
            <div class="current-conditions">
                <div class="condition-emoji" id="conditionEmoji"></div>
                <div class="condition-main">
                    <div class="current-temp" id="currentTemp"></div>
                    <div class="condition-description" id="conditionDescription"></div>
                </div>
                <div class="condition-details">
                    <div class="condition-detail">
                        <span class="detail-icon">🌡️</span>
                        <span id="feelsLike"></span>
                    </div>
                    <div class="condition-detail">
                        <span class="detail-icon">💧</span>
                        <span id="humidity"></span>
                    </div>
                    <div class="condition-detail">
                        <span class="detail-icon">💨</span>
                        <span id="windSpeed"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card 3: Relative Weather (Value Prop) -->
        <div id="weatherDisplay" class="weather-display card hidden">
            <!-- Two-column layout: Temperature + Advice -->
            <div class="comparison-container">
                <!-- Left column: Temperature difference (~1/3) -->
                <div class="temperature-column">
                    <div class="section-header" id="comparisonHeader">Now, compared to Yesterday</div>
                    <div class="difference-hero">
                        <div class="difference-main">
                            <span id="differenceValue"></span>
                            <span id="differenceLabel"></span>
                        </div>
                    </div>
                </div>

                <!-- Right column: What to wear (~2/3) -->
                <div class="advice-column">
                    <div class="section-header section-header-advice">What to Wear</div>
                    <div class="contextual-suggestion" id="contextualSuggestion"></div>
                </div>
            </div>

            <!-- 6-hour temperature forecast chart -->
            <div id="tempForecast" class="temp-forecast-wrapper hidden"></div>

            <!-- Rain forecast chart -->
            <div id="rainForecast" class="rain-forecast-wrapper hidden"></div>
        </div>

        <div id="errorMessage" class="error hidden"></div>

        <!-- Card 3: Recent Searches -->
        <div id="recentSearches" class="recent-searches card hidden">
            <h3>Recent Searches</h3>
            <div id="recentList"></div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
